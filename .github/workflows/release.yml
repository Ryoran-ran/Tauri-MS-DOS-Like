name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify tag matches the application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version."
          }

      - name: Run unit tests
        run: npm test

      - name: Test native functions
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installer and publish GitHub Release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RetroDOS v__VERSION__'
          releaseBody: |
            Windows x64版です。Assetsから `RetroDOS_*_x64-setup.exe` をダウンロードして実行してください。

            このインストーラーは現在コード署名されていないため、Windows SmartScreenの確認画面が表示される場合があります。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
